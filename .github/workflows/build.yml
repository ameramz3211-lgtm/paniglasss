# GitHub par push karte hi ye cloud mein app build karta hai.
# Nateeja: Actions tab > latest run > "Artifacts" mein APK (phone par test) aur AAB (Play Store).
name: Build Paani Glass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Keystore tayyar karein (agar secret diya ho)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PAANI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK aur AAB
        env:
          PAANI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PAANI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PAANI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PaaniGlass-test-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaaniGlass-playstore-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Bani hui files "builds" branch mein rakhein
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/out/PaaniGlass-test.apk"
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/out/PaaniGlass-release.aab"
          cd "$RUNNER_TEMP/out"
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
